name: Publish Server
on:
  push:
    tags:
      - '*'
jobs:
  publish:
    name: Publish ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, linux-x64, osx-x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish
        env:
          OUT_DIR: PamelloV7.Server-${{ github.ref_name }}-${{ matrix.runtime }}
        run: |
          dotnet publish PamelloV7.Server/PamelloV7.Server.csproj \
            --configuration Release \
            --runtime ${{ matrix.runtime }} \
            --self-contained \
            -p:PublishSingleFile=true \
            -p:Version=${{ github.ref_name }} \
            -o "$OUT_DIR"
      - name: Add scripts
        env:
          OUT_DIR: PamelloV7.Server-${{ github.ref_name }}-${{ matrix.runtime }}
        run: |
          os_key="${{ matrix.runtime }}"
          os_key="${os_key%%-*}"
          script_dir="Scripts/$os_key"
          if [ -d "$script_dir" ]; then
            cp "$script_dir"/. "$OUT_DIR"/ -R
            chmod +x "$OUT_DIR"/*.sh 2>/dev/null || true
            echo "Added scripts from $script_dir"
          else
            echo "::warning::No launcher scripts found for '$os_key' ($script_dir)"
          fi
      - name: Create zip
        env:
          OUT_DIR: PamelloV7.Server-${{ github.ref_name }}-${{ matrix.runtime }}
        run: zip -r "$OUT_DIR.zip" "$OUT_DIR"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PamelloV7.Server-${{ matrix.runtime }}
          path: PamelloV7.Server-${{ github.ref_name }}-${{ matrix.runtime }}.zip
          if-no-files-found: error
  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: PamelloV7.Server-*
          merge-multiple: true
      - name: Detect prerelease
        id: prerelease
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build changelog
        run: |
          TAG="${{ github.ref_name }}"
          REPO_URL="https://github.com/${{ github.repository }}"

          if [[ "$TAG" == *-* ]]; then
            PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          else
            PREV=$(git describe --tags --abbrev=0 --exclude '*-*' "$TAG^" 2>/dev/null || true)
          fi

          echo "Current tag:  $TAG"
          echo "Previous tag: ${PREV:-<none, using full history>}"

          RANGE="${PREV:+$PREV..}$TAG"
          git log --no-merges --reverse --format='%s (%h)' "$RANGE" > commits.txt

          grep -iE '^change *: *' commits.txt \
            | sed -E 's/^[^:]*: *//; s/^/* /' \
            | LC_ALL=C sort -f -s -k2,2 > changes.txt || true

          {
            if [ -s changes.txt ]; then
              echo "## What's Changed"
              echo
              cat changes.txt
              echo
            else
              echo "_No user-facing changes in this release_"
              echo
            fi
            if [ -n "$PREV" ]; then
              echo "**Full Changelog**: [$PREV...$TAG]($REPO_URL/compare/$PREV...$TAG)"
            fi
          } > RELEASE_NOTES.md

          cat RELEASE_NOTES.md
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ steps.prerelease.outputs.value }}
          body_path: RELEASE_NOTES.md
          files: '*.zip'
          fail_on_unmatched_files: true
      - name: Notify Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          IS_PRERELEASE: ${{ steps.prerelease.outputs.value }}
          RELEASE_ROLE_ID: "1531251674214174740"
          PRERELEASE_ROLE_ID: "1531251822382288938"
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK secret not set, skipping notification"
            exit 0
          fi

          if [ -s changes.txt ]; then
            CHANGES=$(printf "## What's Changed\n%s" "$(head -c 3000 changes.txt)")
          else
            CHANGES="## What's Changed"$'\n'"_No user-facing changes in this release_"
          fi

          FULL=$(grep '^\*\*Full Changelog\*\*' RELEASE_NOTES.md || true)

          BASE="https://github.com/$REPO/releases/download/$TAG/PamelloV7.Server-$TAG"
          DOWNLOADS=$(printf '## Downloads\n* [Windows](%s-win-x64.zip)\n* [Linux](%s-linux-x64.zip)\n* [macOS](%s-osx-x64.zip)' "$BASE" "$BASE" "$BASE")

          UPDATE='Run your `update.bat`/`update.sh` to update'

          if [ "$IS_PRERELEASE" = "true" ]; then
            ROLE_IDS="$PRERELEASE_ROLE_ID"
          else
            ROLE_IDS="$RELEASE_ROLE_ID"
          fi

          jq -n \
            --arg title "# PamelloV7 $TAG" \
            --arg changes "$CHANGES" \
            --arg full "$FULL" \
            --arg downloads "$DOWNLOADS" \
            --arg update "$UPDATE" \
            --arg roles "$ROLE_IDS" \
            'def sep: { type: 14, divider: true, spacing: 1 };
             def text($c): { type: 10, content: $c };
             ($roles | split(" ") | map(select(. != "" and . != "000000000000000000"))) as $ids |
             {
               username: "GitHub Actions",
               flags: 32768,
               allowed_mentions: { parse: [], roles: $ids },
               components: (
                 [ text($title), sep, text($changes) ]
                 + (if $full == "" then [] else [ sep, text($full) ] end)
                 + [ sep, text($downloads), sep, text($update) ]
                 + (if ($ids | length) == 0 then []
                    else [ sep, text($ids | map("<@&" + . + ">") | join(" ")) ] end)
               )
             }' > discord.json

          curl -sS -f -X POST \
            -H "Content-Type: application/json" \
            -d @discord.json \
            "$WEBHOOK?with_components=true"